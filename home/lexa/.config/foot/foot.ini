# -*- conf -*-

font=DejaVuSansMono:size=11
# dpi-aware=no

[security]
# osc52=enabled  # disabled|copy-enabled|paste-enabled|enabled

[bell]
system=no

[url]
launch=xdg-open ${url}
regex=(((https?://|mailto:|ftp://|file:|ssh:|ssh://|git://|tel:|magnet:|ipfs://|ipns://|gemini://|gopher://|news:)|www\.)([0-9a-zA-Z:/?#@!$&*+,;=.~_%^'\-]+|\([]\["0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]+\)|\[[\(\)"0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]+\]|"[]\[\(\)0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]+"|'[]\[\(\)0-9a-zA-Z:/?#@!$&*+,;=.~_%^\-]+')+([0-9a-zA-Z/#@$&*+=~_%^\-]|\([]\["0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]+\)|\[[\(\)"0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]+\]|"[]\[\(\)0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]+"|'[]\[\(\)0-9a-zA-Z:/?#@!$&*+,;=.~_%^\-]+'))

[cursor]
style=beam
blink=yes
blink-rate=500
beam-thickness=1.5

[colors-dark]
alpha=0.8
alpha-mode=default # Can be `default`, `matching` or `all`
background=000000
foreground=ffffff
regular0=000000 # black
regular1=cc0403  # red
regular2=19cb00  # green
regular3=cecb00  # yellow
regular4=0d73cc  # blue
regular5=cb1ed1  # magenta
regular6=0dcdcd  # cyan
regular7=dddddd  # white
bright0=767676   # bright black
bright1=f2201f   # bright red
bright2=23fd00   # bright green
bright3=fffd00   # bright yellow
bright4=1a8fff   # bright blue
bright5=fd28ff   # bright magenta
bright6=14ffff   # bright cyan
bright7=ffffff   # bright white

